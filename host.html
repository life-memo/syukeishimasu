<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回答表示</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="host-page">

  <div class="container">

    <header class="site-header">
      <button class="back-btn" onclick="history.back()" type="button">&#8592; 戻る</button>
      <p class="eyebrow">HOST</p>
      <h1 class="site-title">回答表示</h1>
    </header>

    <main>

      <!-- PIN認証 -->
      <section class="form-section" aria-label="認証">
        <div class="field-group" style="margin-bottom:0">
          <label class="field-label field-label--pin" for="pin-input">管理PIN</label>
          <input
            type="password"
            id="pin-input"
            placeholder="••••"
            maxlength="20"
            autocomplete="off"
          >
        </div>
      </section>

      <!-- みんなの回答 -->
      <section class="view-section" aria-label="みんなの回答">
        <div class="view-section-header">
          <h2 class="view-section-title">みんなの回答</h2>
          <span class="count-badge" id="count-display" aria-live="polite">— 件</span>
        </div>

        <div id="grouped-list">
          <p class="empty-state">まだ投稿がありません</p>
        </div>

        <div class="view-admin">
          <button class="btn btn-accent" id="toggle-btn"     disabled>回答を表示</button>
          <button class="btn btn-danger" id="delete-all-btn" disabled>全削除</button>
        </div>
      </section>

    </main>

  </div>

  <script type="module" src="host.js"></script>
</body>
</html>
