<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主催者ページ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <header class="site-header">
      <h1 class="site-title">主催者ページ</h1>
    </header>

    <main>

      <!-- PIN認証 -->
      <section class="form-section host-auth" aria-label="主催者認証">
        <div class="field-group">
          <label class="field-label field-label--magenta" for="pin-input">主催者PIN</label>
          <input
            type="password"
            id="pin-input"
            placeholder="••••"
            maxlength="20"
            autocomplete="off"
          >
        </div>
      </section>

      <!-- コントロール -->
      <div class="host-controls">
        <button class="btn btn-accent"  id="toggle-btn"     disabled>回答をすべて表示</button>
        <button class="btn btn-danger"  id="delete-all-btn" disabled>全削除</button>
        <span   class="count-badge"    id="count-display"  aria-live="polite">— 件</span>
      </div>

      <!-- 設問グループ別回答一覧 -->
      <div id="grouped-list">
        <p class="empty-state">まだ投稿がありません</p>
      </div>

    </main>

  </div>

  <script type="module" src="host.js"></script>
</body>
</html>
