<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回答入力</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="toast" id="toast" aria-live="polite" aria-atomic="true">送信しました！</div>

  <div class="container">

    <header class="site-header">
      <h1 class="site-title">回答入力</h1>
    </header>

    <main>
      <section class="form-section" aria-label="回答入力フォーム">

        <div class="field-group">
          <label class="field-label" for="name-input">名前</label>
          <input
            type="text"
            id="name-input"
            placeholder="あなたの名前"
            autocomplete="name"
            maxlength="50"
          >
        </div>

        <div class="field-group">
          <label class="field-label" for="question-select">設問番号</label>
          <select id="question-select">
            <option value="1">Q1</option>
            <option value="2">Q2</option>
            <option value="3">Q3</option>
            <option value="4">Q4</option>
            <option value="5">Q5</option>
          </select>
        </div>

        <div class="field-group">
          <label class="field-label" for="answer-input">回答</label>
          <textarea
            id="answer-input"
            rows="4"
            placeholder="ここに回答を入力してください…"
            maxlength="1000"
          ></textarea>
        </div>

        <p class="error-msg" id="error-msg" role="alert" aria-live="assertive"></p>

        <button class="btn btn-primary" id="submit-btn" type="button">送信</button>

      </section>

      <!-- 回答確認（PIN認証） -->
      <section class="view-section" aria-label="回答確認">
        <div class="view-section-header">
          <h2 class="view-section-title">回答を確認する</h2>
        </div>

        <div class="field-group">
          <label class="field-label field-label--pin" for="view-pin-input">PIN番号</label>
          <input
            type="password"
            id="view-pin-input"
            placeholder="••••"
            maxlength="20"
            autocomplete="off"
          >
        </div>

        <div class="view-controls">
          <button class="btn btn-accent" id="view-toggle-btn" disabled>回答をすべて表示</button>
          <span class="count-badge" id="view-count-display" aria-live="polite">— 件</span>
        </div>

        <div id="view-grouped-list">
          <p class="empty-state">PINを入力してください</p>
        </div>
      </section>

    </main>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
