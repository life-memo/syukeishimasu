<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>回答入力</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="toast" id="toast" aria-live="polite" aria-atomic="true">送信しました！</div>

  <div class="container">

    <header class="site-header">
      <h1 class="site-title">回答入力</h1>
    </header>

    <main>
      <section class="form-section" aria-label="回答入力フォーム">

        <div class="field-group">
          <label class="field-label" for="name-input">名前</label>
          <input
            type="text"
            id="name-input"
            placeholder="あなたの名前"
            autocomplete="name"
            maxlength="50"
          >
        </div>

        <div class="field-group">
          <label class="field-label" for="answer-input">回答</label>
          <textarea
            id="answer-input"
            rows="4"
            placeholder="ここに回答を入力してください…"
            maxlength="1000"
          ></textarea>
        </div>

        <p class="error-msg" id="error-msg" role="alert" aria-live="assertive"></p>

        <button class="btn btn-primary" id="submit-btn" type="button">送信</button>

      </section>

      <!-- 回答一覧 -->
      <section class="view-section" aria-label="回答一覧">
        <div class="view-section-header">
          <h2 class="view-section-title">回答一覧</h2>
          <span class="count-badge" id="view-count-display" aria-live="polite">— 件</span>
        </div>

        <div id="view-grouped-list">
          <p class="empty-state">まだ回答がありません</p>
        </div>

      </section>

      <div class="admin-link-wrap">
        <a href="host.html" class="admin-link">管理画面 →</a>
      </div>

    </main>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
